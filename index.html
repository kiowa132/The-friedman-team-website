<!doctype html>
<html lang="en" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>The Friedman Team | Luxury Maryland Real Estate & Estates</title>
    <meta name="description" content="Strategic real estate representation for Maryland luxury properties, farms, estates, and distinctive homes in Carroll County, Baltimore County, Howard County, and surrounding markets." />

    <!-- Favicon, generated from the real Friedman Team "F" brand mark -->
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/favicon-192.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    
    <!-- Open Graph SEO -->
    <meta property="og:title" content="The Friedman Team | Luxury Maryland Estates & Strategic Home Sales" />
    <meta property="og:description" content="The trusted advisor for strategic home sales, luxury properties, farms, estates, and distinctive Maryland homes." />
    <meta property="og:image" content="https://www.friedmanreteam.com/images/kyle-portrait.jpg" />
    <meta property="og:type" content="website" />

    <!-- RealEstateAgent structured data - real, live JSON-LD (this replaces
         the old "SEO & Schema Inspector" drawer, which only displayed this
         same schema in a copy-paste UI panel and never actually injected it
         into the page, despite labeling it "Active"). Static business info
         like this belongs here rather than per-page, since it doesn't
         change from page to page. -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "RealEstateAgent",
      "name": "The Friedman Team | eXp Realty",
      "image": "https://www.friedmanreteam.com/images/kyle-portrait.jpg",
      "url": "https://www.friedmanreteam.com/",
      "telephone": "+1-443-789-3101",
      "priceRange": "$$$$",
      "address": {
        "@type": "PostalAddress",
        "streetAddress": "8115 Maple Lawn Blvd #350",
        "addressLocality": "Fulton",
        "addressRegion": "MD",
        "postalCode": "20759",
        "addressCountry": "US"
      },
      "areaServed": [
        { "@type": "AdministrativeArea", "name": "Carroll County, MD" },
        { "@type": "AdministrativeArea", "name": "Baltimore County, MD" },
        { "@type": "AdministrativeArea", "name": "Howard County, MD" },
        { "@type": "AdministrativeArea", "name": "Frederick County, MD" },
        { "@type": "City", "name": "Fulton" },
        { "@type": "City", "name": "Westminster" },
        { "@type": "City", "name": "Sykesville" },
        { "@type": "City", "name": "Mount Airy" },
        { "@type": "City", "name": "Frederick" }
      ],
      "founder": {
        "@type": "Person",
        "name": "Kyle Friedman",
        "jobTitle": "Principal Advisor"
      },
      "knowsAbout": [
        "Residential Real Estate",
        "Farms & Land Sales",
        "Data-Driven Pricing Strategy",
        "Off-Market & Coming-Soon Listings"
      ]
    }
    </script>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400;1,600&family=Inter:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  </head>
  <body class="bg-[#F5F1E8] text-[#1A2628] antialiased selection:bg-[#C9A96A] selection:text-[#0F5C63]">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
