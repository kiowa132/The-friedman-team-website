<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Chief Lite</title>
<style>
:root { --bg:#f6f7f9; --card:#fff; --ink:#1b2430; --mute:#667085; --line:#e3e6ea; --ok:#12805c; --warn:#b25e09; --bad:#b42318; --accent:#1d4ed8; }
@media (prefers-color-scheme: dark) { :root { --bg:#10151c; --card:#18202a; --ink:#e8edf3; --mute:#9aa6b4; --line:#2a3542; --ok:#4cc38a; --warn:#f2a54a; --bad:#ff7b72; --accent:#7aa2ff; } }
* { box-sizing: border-box; }
body { margin:0; background:var(--bg); color:var(--ink); font:16px/1.4 system-ui, -apple-system, Segoe UI, sans-serif; padding:16px; padding-bottom:calc(16px + env(safe-area-inset-bottom)); }
main { max-width:560px; margin:0 auto; }
h1 { font-size:20px; margin:0 0 4px; }
.sub { color:var(--mute); font-size:13px; margin-bottom:12px; }
.bar { display:flex; align-items:center; gap:8px; font-size:13px; margin-bottom:12px; }
.dot { width:10px; height:10px; border-radius:50%; background:var(--mute); }
.dot.ok { background:var(--ok); } .dot.off { background:var(--bad); }
textarea { width:100%; min-height:84px; font:inherit; padding:12px; border:1px solid var(--line); border-radius:12px; background:var(--card); color:var(--ink); resize:vertical; }
button { font:inherit; padding:12px 16px; border-radius:12px; border:0; background:var(--accent); color:#fff; font-weight:600; min-height:44px; }
button.ghost { background:transparent; color:var(--mute); border:1px solid var(--line); font-weight:400; }
button:disabled { opacity:.5; }
.row { display:flex; gap:8px; align-items:center; margin:8px 0 16px; }
.row .count { margin-left:auto; color:var(--mute); font-size:12px; }
.item { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:12px; margin-bottom:10px; }
.q { font-weight:600; white-space:pre-wrap; word-wrap:break-word; }
.a { margin-top:6px; white-space:pre-wrap; word-wrap:break-word; }
.meta { color:var(--mute); font-size:12px; margin-top:6px; }
.tag { font-size:11px; padding:2px 8px; border-radius:99px; border:1px solid var(--line); }
.tag.queued { color:var(--warn); } .tag.picked { color:var(--accent); } .tag.done { color:var(--ok); }
.note { color:var(--mute); font-size:13px; }
.err { color:var(--bad); font-size:14px; margin:6px 0; min-height:1em; }
#setup input { width:100%; padding:12px; border:1px solid var(--line); border-radius:12px; background:var(--card); color:var(--ink); font:inherit; margin:6px 0; }
.hide { display:none; }
</style>
</head>
<body>
<main>
  <h1>Chief Lite</h1>
  <div class="sub">Works when every computer is off. Quick answers come back at once; everything else waits for a computer to wake.</div>

  <section id="setup" class="hide">
    <div class="note">One time only. The address and token stay on this phone (never in the page file).</div>
    <input id="fn" placeholder="Function address (https://...supabase.co/functions/v1/chief-lite)" autocomplete="off" autocapitalize="off" spellcheck="false">
    <input id="tok" type="password" placeholder="Token" autocomplete="off">
    <div class="row"><button id="save">Save</button></div>
  </section>

  <section id="main" class="hide">
    <div class="bar"><span class="dot" id="dot"></span><span id="status">connecting</span><button class="ghost" id="reset" style="margin-left:auto;min-height:32px;padding:4px 10px;font-size:12px">Change token</button></div>
    <textarea id="box" maxlength="300" placeholder="Ask Chief: what needs me, today, deals, results... or any request" enterkeyhint="send"></textarea>
    <div class="row"><button id="send">Send</button><span class="count" id="count">0 / 300</span></div>
    <div class="err" id="err"></div>
    <div id="list"></div>
  </section>
</main>
<script>
(function () {
  "use strict";
  var KEY_URL = "chiefLite.url", KEY_TOK = "chiefLite.token", KEY_Q = "chiefLite.cache";
  var $ = function (id) { return document.getElementById(id); };
  function get(k) { try { return localStorage.getItem(k) || ""; } catch (e) { return ""; } }
  function put(k, v) { try { if (v) localStorage.setItem(k, v); else localStorage.removeItem(k); } catch (e) {} }
  var fnUrl = get(KEY_URL), token = get(KEY_TOK), online = true, timer = null, busy = false;

  function esc(s) { return String(s == null ? "" : s); }       // text is always set as plain text
  function setStatus(ok, msg) { $("dot").className = "dot " + (ok ? "ok" : "off"); $("status").textContent = msg; }
  function ago(iso) {
    var t = Date.parse(iso); if (!t) return "";
    var m = Math.max(0, Math.round((Date.now() - t) / 60000));
    return m < 1 ? "just now" : m < 60 ? m + " min ago" : m < 1440 ? Math.round(m / 60) + " h ago" : Math.round(m / 1440) + " d ago";
  }

  function call(method, path, body) {
    var opt = { method: method, headers: { "Authorization": "Bearer " + token }, cache: "no-store" };
    if (body) { opt.headers["Content-Type"] = "application/json"; opt.body = JSON.stringify(body); }
    return fetch(fnUrl.replace(/\/+$/, "") + path, opt).then(function (r) {
      return r.json().catch(function () { return { ok: false, error: "bad_reply" }; }).then(function (j) { j.httpStatus = r.status; return j; });
    });
  }

  function render(items, stale) {
    var box = $("list"); box.textContent = "";
    if (!items || !items.length) {
      var n = document.createElement("div"); n.className = "note"; n.textContent = "No requests yet."; box.appendChild(n); return;
    }
    items.forEach(function (it) {
      var d = document.createElement("div"); d.className = "item";
      var q = document.createElement("div"); q.className = "q"; q.textContent = esc(it.text); d.appendChild(q);
      var a = document.createElement("div"); a.className = "a";
      a.textContent = it.answer ? esc(it.answer) : (it.status === "picked" ? "A computer has it and is working." : "Waiting for a computer to pick this up.");
      d.appendChild(a);
      var m = document.createElement("div"); m.className = "meta";
      var t = document.createElement("span"); t.className = "tag " + esc(it.status); t.textContent = esc(it.status);
      m.appendChild(t); m.appendChild(document.createTextNode(" " + ago(it.answered_at || it.created_at) + (stale ? " (saved copy)" : "")));
      d.appendChild(m); box.appendChild(d);
    });
  }

  function refresh() {
    if (!fnUrl || !token) return;
    call("GET", "/answers").then(function (j) {
      if (j.httpStatus === 401) { setStatus(false, "token rejected"); $("err").textContent = "The token was not accepted. Tap Change token."; return; }
      if (!j.ok) throw new Error(j.error || "failed");
      online = true; setStatus(true, "online");
      put(KEY_Q, JSON.stringify(j.items || [])); render(j.items, false);
    }).catch(function () {
      online = false; setStatus(false, "offline, showing the last saved list");
      var c = []; try { c = JSON.parse(get(KEY_Q) || "[]"); } catch (e) {} render(c, true);
    });
  }

  function send() {
    if (busy) return;
    var text = $("box").value.replace(/\s+/g, " ").trim();
    if (!text) { $("err").textContent = "Type something first."; return; }
    if (text.length > 300) { $("err").textContent = "Keep it under 300 characters."; return; }
    if (!navigator.onLine) { $("err").textContent = "You are offline. Your text is still in the box; send it when you have signal."; return; }
    busy = true; $("send").disabled = true; $("err").textContent = "";
    call("POST", "/ask", { text: text }).then(function (j) {
      if (j.ok) { $("box").value = ""; $("count").textContent = "0 / 300"; refresh(); return; }
      var map = { rate_limited: "Too many requests. Wait a minute.", unauthorized: "Token not accepted.", too_long: "Too long (300 max).", queue_full: "The queue is full; try again later.", not_configured: "The service is not set up yet." };
      $("err").textContent = map[j.error] || "Could not send (" + esc(j.error || j.httpStatus) + "). Your text is still in the box.";
    }).catch(function () {
      $("err").textContent = "No connection. Your text is still in the box.";
    }).then(function () { busy = false; $("send").disabled = false; });
  }

  function show() {
    var ready = !!(fnUrl && token);
    $("setup").className = ready ? "hide" : ""; $("main").className = ready ? "" : "hide";
    if (ready) { refresh(); clearInterval(timer); timer = setInterval(function () { if (!document.hidden) refresh(); }, 20000); }
  }

  $("save").onclick = function () {
    var u = $("fn").value.trim(), t = $("tok").value.trim();
    if (!/^https:\/\//i.test(u) || t.length < 24) { alert("Enter the https address and the full token."); return; }
    put(KEY_URL, u); put(KEY_TOK, t); fnUrl = u; token = t; $("tok").value = ""; show();
  };
  $("reset").onclick = function () { put(KEY_TOK, ""); token = ""; $("err").textContent = ""; show(); };
  $("send").onclick = send;
  $("box").addEventListener("input", function () { $("count").textContent = $("box").value.length + " / 300"; });
  window.addEventListener("online", refresh);
  window.addEventListener("offline", function () { setStatus(false, "offline"); });
  document.addEventListener("visibilitychange", function () { if (!document.hidden) refresh(); });
  show();
})();
</script>
</body>
</html>
