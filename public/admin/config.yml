backend:
  name: github
  repo: kiowa132/The-friedman-team-website
  branch: main
  base_url: https://www.friedmanreteam.com
  auth_endpoint: api/decap-auth

# Where uploaded images get saved, and the URL path the site uses to serve them.
media_folder: "public/images/uploads"
public_folder: "/images/uploads"

# Batch photo upload via Cloudinary's free media library: multi-select upload
# + automatic compression (a raw ~15 MB phone photo no longer breaks the build).
# cloud_name + api_key are publishable and safe here. The API *secret* is never
# used by this widget and must not go in this file.
media_library:
  name: cloudinary
  config:
    cloud_name: nz8ywyg0
    api_key: "166132664384538"
    multiple: true

collections:
  - name: "blog"
    label: "The Friedman Report (Blog)"
    folder: "content/blog"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Meta Description (for Google/SEO)", name: "metaDescription", widget: "text" }
      - label: "Category"
        name: "category"
        widget: "select"
        options: ["Market Reports", "Sell Your Home", "Buy a Home"]
      - { label: "Publish Date", name: "publishDate", widget: "date", required: true, format: "YYYY-MM-DD", default: "{{now}}" }
      - { label: "Hero Image", name: "heroImage", widget: "image", hint: "Recommended size: 1600x900px (16:9 ratio). Keep file size under 500KB for fast loading." }
      - { label: "YouTube Video ID (just the ID, not the full URL)", name: "youtubeVideoId", widget: "string", required: false, hint: "From youtube.com/watch?v=THIS_PART. Leave blank if this post has no video - it won't show anything if empty." }
      - { label: "Carousel Images", name: "carouselImages", widget: "list", required: false, hint: "Recommended size: 1000x1250px (4:5 portrait ratio) per photo, under 400KB each.", field: { label: "Image", name: "image", widget: "image" } }
      - { label: "Related Guide (slug)", name: "relatedGuideSlug", widget: "string", required: false, hint: "Must match a guide's filename exactly, e.g. carroll-county-seller-guide" }
      - { label: "Related Area (slug)", name: "relatedAreaSlug", widget: "select", required: false, options: ["carroll-county", "baltimore-county", "howard-county", "frederick-county"] }
      - label: "Friedman Market Momentum Index (FMMI)"
        name: "fmmi"
        widget: "object"
        required: false
        collapsed: true
        hint: "Only fill this in for a weekly Market Report post. Leave collapsed/empty for every other post. Filling this in is what makes the homepage Market Pulse card update automatically - nothing else needs to change."
        fields:
          - { label: "This Week's Score (0-100)", name: "score", widget: "number", required: false }
          - { label: "Headline Label", name: "label", widget: "string", required: false, hint: "e.g. Balanced Market, Cooling Again" }
          - { label: "The Friedman Signal", name: "signal", widget: "string", required: false, hint: "e.g. Cooling, Warming, Balanced" }
          - label: "Demand"
            name: "demand"
            widget: "object"
            required: false
            collapsed: true
            fields:
              - { label: "Score", name: "score", widget: "number", required: false }
              - { label: "Last Week's Score", name: "previous", widget: "number", required: false }
              - { label: "One-Sentence Note", name: "note", widget: "text", required: false }
          - label: "Seller Strength"
            name: "sellerStrength"
            widget: "object"
            required: false
            collapsed: true
            fields:
              - { label: "Score", name: "score", widget: "number", required: false }
              - { label: "Last Week's Score", name: "previous", widget: "number", required: false }
              - { label: "One-Sentence Note", name: "note", widget: "text", required: false }
          - label: "Market Speed"
            name: "marketSpeed"
            widget: "object"
            required: false
            collapsed: true
            fields:
              - { label: "Score", name: "score", widget: "number", required: false }
              - { label: "Last Week's Score", name: "previous", widget: "number", required: false }
              - { label: "One-Sentence Note", name: "note", widget: "text", required: false }
          - label: "Rate Environment"
            name: "rateEnvironment"
            widget: "object"
            required: false
            collapsed: true
            fields:
              - { label: "Score", name: "score", widget: "number", required: false }
              - { label: "Last Week's Score", name: "previous", widget: "number", required: false }
              - { label: "One-Sentence Note", name: "note", widget: "text", required: false }
      - label: "Body"
        name: "body"
        widget: "markdown"
        hint: "Use the toolbar buttons above (Bold, Italic, headings, lists, quote, link) to format text, and the image button to insert photos right where you want them - both always produce correct formatting. If you paste text from ChatGPT or another AI tool, paste it as plain text first (Ctrl+Shift+V / Cmd+Shift+V) and then use the toolbar to format it, rather than pasting already-formatted text directly - pasted markdown symbols can come through as literal characters (**text** instead of bold) instead of real formatting."
        modes: ["rich_text", "raw"]
        default_mode: "rich_text"
        buttons: ["bold", "italic", "link", "heading-one", "heading-two", "quote", "bulleted-list", "numbered-list", "code"]
        editor_components: ["image"]

  - name: "guides"
    label: "Free Guides"
    folder: "content/guides"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Description", name: "description", widget: "text" }
      - { label: "Cover Image", name: "coverImage", widget: "image", hint: "Recommended size: 1200x900px (4:3 ratio), under 500KB." }
      - { label: "PDF File (upload once you have the real guide)", name: "pdfUrl", widget: "file", required: false }
      - { label: "Related Blog Post (slug)", name: "relatedPostSlug", widget: "string", required: false }
      - label: "What's Inside (short bullet points, shown before someone submits their info)"
        name: "previewPoints"
        widget: "list"
        required: false
        hint: "Short, punchy bullets - e.g. 'How Carroll County pricing actually works right now'. Builds trust before the ask."
      - label: "Full Guide Content (the real content - unlocks on the page right after someone submits their info)"
        name: "body"
        widget: "markdown"
        required: false
        hint: "Use the toolbar buttons to format text - if pasting from ChatGPT or another AI tool, paste as plain text first (Ctrl+Shift+V / Cmd+Shift+V), then format with the toolbar."
        modes: ["rich_text", "raw"]
        default_mode: "rich_text"
        buttons: ["bold", "italic", "link", "heading-one", "heading-two", "quote", "bulleted-list", "numbered-list", "code"]
        editor_components: ["image"]
      - label: "Publuu Flipbook Embed URL (optional - shows an interactive page-flip viewer instead of plain text)"
        name: "publuuEmbedUrl"
        widget: "string"
        required: false
        hint: "Only fill this in if you've turned this guide into an actual PDF and uploaded it to publuu.com. On Publuu, click EMBED on your flipbook, and from the embed code it gives you, copy just the URL inside the quotes after src= (looks like https://publuu.com/flip-book/1234/5678?embed=1) - paste that whole URL here, not the full <iframe> code."
      - label: "Flipbook Pages (free in-house page-flip viewer - one image per page, in order)"
        name: "flipbookPages"
        widget: "list"
        required: false
        hint: "Send Kyle's real PDF over and he'll convert it into these page images for you - once added here, the guide shows a real interactive page-turning book, no third-party service needed."

  - name: "listings"
    label: "Sign Listings (For Sale Sign QR)"
    folder: "content/listings"
    create: true
    slug: "{{slug}}"
    summary: "{{status}} - {{streetAddress}} {{mlsId}}"
    fields:
      - label: "Show on the sign QR (/listings/active)"
        name: "active"
        widget: "boolean"
        default: true
        hint: "Turn this ON for the one listing your For Sale sign's QR code should currently show. Turn it OFF on the old one when you switch. Only one should be ON at a time."
      - label: "MLS # (fills in everything below automatically)"
        name: "mlsId"
        widget: "string"
        required: false
        hint: "Paste your listing's MLS number. On each publish, the address, price, beds, baths, sq ft, year, status, and description are pulled from Lofty and baked into the page (no slow live lookup). Every field below is optional - only fill one to override what Lofty has, or if Lofty doesn't carry this listing (e.g. Eastern Shore), or you have no MLS number yet."
      - { label: "Status (override)", name: "status", widget: "string", required: false, hint: "Leave blank to use Lofty's status. Or type: Coming Soon / Active / Pending / Under Contract / Sold" }
      - { label: "Street Address (override)", name: "streetAddress", widget: "string", required: false, hint: "e.g. 315 Park Ave" }
      - { label: "City, State ZIP (override)", name: "cityStateZip", widget: "string", required: false, hint: "e.g. Salisbury, MD 21801" }
      - { label: "List Price (override)", name: "listPrice", widget: "string", required: false, hint: "Type it exactly as it should show, e.g. $199,999" }
      - { label: "Bedrooms (override)", name: "beds", widget: "string", required: false }
      - { label: "Bathrooms (override)", name: "baths", widget: "string", required: false, hint: "e.g. 3  (or 3 / 1 for full/half)" }
      - { label: "Square Feet (override)", name: "sqft", widget: "string", required: false }
      - { label: "Lot Size (override)", name: "lotSize", widget: "string", required: false, hint: "e.g. 0.25 acres" }
      - { label: "Year Built (override)", name: "yearBuilt", widget: "string", required: false }
      - { label: "Virtual Tour / Video URL", name: "tourUrl", widget: "string", required: false, hint: "Matterport or YouTube link - optional" }
      - { label: "Hero / Main Photo (override)", name: "heroImage", widget: "image", required: false, hint: "Optional. If left blank, the page uses the first gallery photo below, then the photo folder, then Lofty's photo." }
      - label: "Photo Gallery (override)"
        name: "photos"
        widget: "list"
        required: false
        hint: "Optional. Best case: leave empty and let the photos come from Lofty. Otherwise add them here. In the media picker you can drag several files in at once to upload them, then insert them. COMPRESS FIRST - keep each under ~400KB (tinypng.com), phone photos are ~15MB and will break the build."
        field: { label: "Photo", name: "image", widget: "image" }
      - label: "Highlights / Description (override)"
        name: "body"
        widget: "markdown"
        required: false
        hint: "Optional. If left blank, Lofty's listing remarks are used. To write your own, paste from another tool as plain text first (Ctrl+Shift+V / Cmd+Shift+V), then format with the toolbar."
        modes: ["rich_text", "raw"]
        default_mode: "rich_text"
        buttons: ["bold", "italic", "link", "heading-one", "heading-two", "quote", "bulleted-list", "numbered-list"]
        editor_components: ["image"]
    # Batch photo upload: put all the listing photos in
    # public/images/listings/<slug>/  (e.g. public/images/listings/listing-1/).
    # GitHub's web "Add file > Upload files" takes a whole folder of images
    # in one drag. They're sorted by filename; name one "hero.jpg" to force
    # it as the main image. generate-listings-manifest.mjs picks them up.
